server:
  host: "0.0.0.0"
  port: 8080
  # Public origin Limen is reachable on. Required once Phase 4 lands;
  # used as the OIDC issuer / MCP RS base URL.
  base_url: "${LIMEN_BASE_URL:-https://limen.example.com}"

# Logger configuration for `gateway serve`. Level accepts debug / info /
# warn / error (the standard zapcore names). Development=true switches
# from the JSON production encoder to the colored development encoder.
logging:
  level: "${LIMEN_LOG_LEVEL:-info}"
  development: ${LIMEN_LOG_DEVELOPMENT:-false}

database:
  # Postgres connection string for the request-path pool. Should authenticate
  # as limen_app (no BYPASSRLS) so the Phase 3 row-level-security policies
  # actually fire.
  dsn: "${LIMEN_DB_DSN}"
  # Postgres connection string for the migration / WithSuperuser pool. Should
  # authenticate as limen_admin (BYPASSRLS). Falls back to dsn when empty —
  # only acceptable in dev / single-role setups.
  admin_dsn: "${LIMEN_DB_ADMIN_DSN:-}"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "1h"

security:
  # 32-byte AES-SIV key. Accepts base64 (standard/URL, padded/unpadded) or
  # 64-character hex. Generate with: openssl rand -hex 32
  token_encryption_key: "${LIMEN_TOKEN_ENCRYPTION_KEY}"
  portal_session_cookie_name: "limen_portal"
  portal_session_cookie_secure: true

# Phase 5 — thin OAuth proxy (Zitadel is the AS). Holds only the DCR
# proxy's own knobs; the upstream Zitadel client config lives under
# `zitadel:` below.
oauth_proxy:
  # Global kill-switch for /register* . Per-tenant gating still happens via
  # Tenant.DCREnabled.
  dcr_enabled: true
  # If set, /register requires this initial-access-token (RFC 7591 §3).
  dcr_initial_access_token: "${LIMEN_DCR_INITIAL_ACCESS_TOKEN:-}"
  # Per-tenant token-bucket on /register* . Defaults: 10 rps / burst 20.
  rate_limit:
    rps: 10
    burst: 20

# Per-tenant, per-user MCP upstreams are loaded from the database (see
# `limen create-upstream` and the portal's Upstreams section). There is no
# YAML-driven upstream list — every upstream is owned by a tenant.

codemode:
  execution_timeout: "30s"
  max_memory_mb: 64
  # Phase 8b: per-invocation cap on in-flight upstream tool calls.
  # Tool proxies return Promises and dispatch off-VM; this bounds the
  # fan-out budget consumed by Promise.all. Defaults to 8.
  max_concurrent_tool_calls: 8

# Phase 4 — portal OIDC relying party against Zitadel.
oidc:
  issuer: "${LIMEN_OIDC_ISSUER:-http://localhost:8081}"
  client_id: "${LIMEN_OIDC_CLIENT_ID}"
  client_secret: "${LIMEN_OIDC_CLIENT_SECRET:-}"
  redirect_uri: "${LIMEN_OIDC_REDIRECT_URI:-https://limen.example.com/auth/callback}"
  scopes:
    - openid
    - profile
    - email
    - offline_access
    # Required: causes Zitadel to emit the
    # urn:zitadel:iam:user:resourceowner:id claim in the ID token so
    # Limen can verify the logged-in user's home org matches the tenant
    # in the URL. See docs/security.md "Tenant ↔ Zitadel org binding".
    - urn:zitadel:iam:user:resourceowner
  post_logout_redirect_uri: "${LIMEN_OIDC_POST_LOGOUT_REDIRECT_URI:-}"

# Phase 4 — Zitadel Management API client (used by `limen create-tenant`).
zitadel:
  domain: "${LIMEN_ZITADEL_DOMAIN:-http://localhost:8081}"
  # pat | jwt_key
  auth_mode: "${LIMEN_ZITADEL_AUTH_MODE:-pat}"
  pat: "${LIMEN_ZITADEL_PAT:-}"
  jwt_key_path: "${LIMEN_ZITADEL_JWT_KEY_PATH:-}"
  project_id: "${LIMEN_ZITADEL_PROJECT_ID}"
  # Audience MCP access tokens must carry in `aud`. Typically the Zitadel
  # project audience id emitted as "<project_id>@<project_name>". The MCP
  # resource server (Phase 6) rejects any token whose `aud` does not match.
  mcp_resource_audience: "${LIMEN_ZITADEL_MCP_RESOURCE_AUDIENCE}"
  http_timeout: "30s"

# Phase 7 — Valkey (Redis-protocol) client. Used for one-shot OAuth state
# during upstream linking; TTL-driven so no janitor process is needed.
# In dev this is the Valkey container co-located with the Zitadel cache;
# in prod, a dedicated Valkey is fine. Limen owns the "limen:*" keyspace.
valkey:
  address: "${LIMEN_VALKEY_ADDRESS:-limen-valkey:6379}"
  password: "${LIMEN_VALKEY_PASSWORD:-}"
  dial_timeout: "5s"

# Phase 7 — background refresher + auto-disable tunables. Defaults are
# fine for most deployments; override only what you want to move.
upstream_refresh:
  interval: "2m" # how often the refresher wakes up
  refresh_window: "5m" # tokens expiring within this window get rotated
  proactive_window: "60s" # per-request fast-path refresh threshold
  fail_threshold: 5 # min consecutive failures to trip auto-disable
  fail_window: "15m" # min streak elapsed time to trip auto-disable
  needs_relink_window: "24h" # NeedsRelink=true for this long → auto-disable
