<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Limen Portal</title>
    <script>
      // No-flash theme boot. Runs synchronously before the SPA paints so the
      // initial frame already has the correct .dark class. See
      // docs/frontend-design.md §3.4.
      (function () {
        try {
          var mode = localStorage.getItem('limen.theme') || 'system'
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = mode === 'dark' || (mode === 'system' && prefersDark)
          if (dark) document.documentElement.classList.add('dark')
        } catch (_) {
          /* SSR / private mode — ignore */
        }
      })()
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
