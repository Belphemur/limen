# Limen dev stack — Postgres for Limen, MailHog, and the Limen bootstrap runner.
#
# The Zitadel half of the stack lives in scripts/zitadel/docker-compose.yml
# (vendored verbatim from https://github.com/zitadel/zitadel/tree/main/deploy/compose).
# Both files are layered together by the Makefile:
#
#   docker compose --env-file scripts/zitadel/.env \
#     -f scripts/zitadel/docker-compose.yml \
#     -f scripts/zitadel/docker-compose.limen.yaml \
#     -f compose.dev.yaml \
#     up -d --wait
#
# The merge produces a single project (name: limen-dev) where:
#   - Zitadel proxy publishes on host port 8081 (Limen owns 8080).
#   - All services share the "zitadel" network so the bootstrap runner can
#     reach zitadel-api by name.
#   - The "zitadel-bootstrap" volume (declared by the upstream compose) is
#     mounted read-only into our bootstrap runner so it can read the admin
#     service-account PAT seeded by docker-compose.limen.yaml.

name: limen-dev

services:
  limen-postgres:
    image: postgres:18.2-alpine
    environment:
      POSTGRES_USER: limen
      POSTGRES_PASSWORD: limen_dev
      POSTGRES_DB: limen
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "limen"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
    networks:
      - zitadel

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - zitadel

  # One-shot. Provisions the Limen project, Portal/MCP RS apps, project roles,
  # sample tenant org, and staff org via the Zitadel Management API.
  # Idempotent. Run via `make dev-bootstrap`.
  zitadel-bootstrap:
    image: golang:1.26-alpine
    profiles: ["bootstrap"]
    depends_on:
      zitadel-api:
        condition: service_healthy
    volumes:
      - ./scripts/zitadel-bootstrap:/work
      - zitadel-bootstrap:/zitadel/bootstrap:ro
      - go-mod-cache:/go/pkg/mod
    working_dir: /work
    command: ["go", "run", "."]
    environment:
      # The SDK dials zitadel-api:8080 on the internal docker network but
      # sets the gRPC :authority to ZITADEL_HOST so Zitadel's ExternalDomain
      # check (configured to "localhost") accepts the request.
      ZITADEL_API_HOST: "zitadel-api"
      ZITADEL_API_PORT: "8080"
      ZITADEL_HOST: "localhost"
      ZITADEL_PAT_FILE: "/zitadel/bootstrap/admin-sa.pat"
      LIMEN_PORTAL_REDIRECT: "http://localhost:8080/auth/callback"
      LIMEN_MCP_RESOURCE_URI: "http://localhost:8080/t/{tenant}/mcp"
      LIMEN_SAMPLE_TENANT_NAME: "acme"
      LIMEN_BOOTSTRAP_OUT: "/work/.bootstrap-out.env"
    networks:
      - zitadel

volumes:
  pg-data:
  go-mod-cache:
