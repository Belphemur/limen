name: CI

on:
  push:
    branches:
      - main
      # feat-billing is a long-lived integration branch for the billing
      # telemetry pipeline work. CI on push is intentional during active
      # development. Remove this line after feat-billing merges to main.
      - feat-billing
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run unit tests with coverage
        run: |
          # Pinning gotestsum to a fixed version is recommended for
          # reproducible CI, but we intentionally use @latest because
          # the tool's go.mod must remain compatible with our Go
          # toolchain (1.26) and maintaining version sync is manual
          # overhead with no immediate benefit. The `go run` cache
          # keyed on source hash prevents unexpected drift within a
          # single CI run.
          go run gotest.tools/gotestsum@latest \
            --junitfile go-unit-junit.xml \
            -- -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7  # v5.5.1
        with:
          use_oidc: true
          files: coverage.out
          flags: backend
          fail_ci_if_error: false
      - name: Upload Go unit test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7  # v5.5.1
        with:
          use_oidc: true
          files: go-unit-junit.xml
          flags: backend
          report_type: test_results
          fail_ci_if_error: false

  backend-integration:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run integration tests
        run: |
          # Same rationale as unit tests: @latest avoids Go toolchain
          # compatibility churn. See comment in backend-unit for details.
          go run gotest.tools/gotestsum@latest \
            --junitfile go-integration-junit.xml \
            -- -v -tags=integration -coverprofile=coverage-integration.out -covermode=atomic ./...
      - name: Upload Go integration coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7  # v5.5.1
        with:
          use_oidc: true
          files: coverage-integration.out
          flags: backend,integration
          fail_ci_if_error: false
      - name: Upload Go integration test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7  # v5.5.1
        with:
          use_oidc: true
          files: go-integration-junit.xml
          flags: backend
          report_type: test_results
          fail_ci_if_error: false

  frontend-unit:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 15
    strategy:
      matrix:
        package: [shared, portal, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Add Go and npm bin directories to PATH
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/web/portal/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install protoc tools and web dependencies
        run: make tools

      - name: Generate TypeScript protobuf bindings
        run: make proto

      - name: Run ${{ matrix.package }} unit tests with coverage
        working-directory: web/${{ matrix.package }}
        run: pnpm test --coverage
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7  # v5.5.1
        with:
          use_oidc: true
          flags: frontend
          directory: web/${{ matrix.package }}
          fail_ci_if_error: false

  frontend-e2e-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Add Go and npm bin directories to PATH
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/web/portal/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install protoc tools and web dependencies
        run: make tools

      - name: Generate TypeScript protobuf bindings
        run: make proto

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers (cache miss)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: web/portal
        run: pnpm e2e:install

      - name: Run portal E2E tests
        working-directory: web/portal
        run: pnpm e2e

  frontend-e2e-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Add Go and npm bin directories to PATH
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/web/portal/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install protoc tools and web dependencies
        run: make tools

      - name: Generate TypeScript protobuf bindings
        run: make proto

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers (cache miss)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: web/admin
        run: pnpm e2e:install

      - name: Run admin E2E tests
        working-directory: web/admin
        run: pnpm e2e

  ci-gate:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend-unit
      - backend-integration
      - frontend-unit
      - frontend-e2e-portal
      - frontend-e2e-admin
    steps:
      - name: Check all dependency jobs passed
        run: |
          set -euo pipefail
          echo "backend-unit:       ${{ needs.backend-unit.result }}"
          echo "backend-integration: ${{ needs.backend-integration.result }}"
          echo "frontend-unit:      ${{ needs.frontend-unit.result }}"
          echo "frontend-e2e-portal: ${{ needs.frontend-e2e-portal.result }}"
          echo "frontend-e2e-admin:  ${{ needs.frontend-e2e-admin.result }}"
          if [ "${{ needs.backend-unit.result }}" = "success" ] \
             && [ "${{ needs.backend-integration.result }}" = "success" ] \
             && [ "${{ needs.frontend-unit.result }}" = "success" ] \
             && [ "${{ needs.frontend-e2e-portal.result }}" = "success" ] \
             && [ "${{ needs.frontend-e2e-admin.result }}" = "success" ]; then
            echo "All CI jobs passed."
          else
            echo "One or more CI jobs failed, were cancelled, or were skipped."
            exit 1
          fi
