syntax = "proto3";

package limen.admin.v1;

import "limen/portal/v1/portal.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/belphemur/limen/internal/admin/adminv1;adminv1";

// AdminService is the admin/owner-scoped tenant control surface mounted
// at /t/{tenant}/api/limen.admin.v1.AdminService/*. Tenant is resolved
// by the binary's interceptor stack from the URL {tenant} segment;
// request messages MUST NOT carry a tenant_id field.
//
// Public, tenant-agnostic signup lives on limen.signup.v1.SignupService
// at the root /api/ mount — not here.
service AdminService {
  // Upstream catalog CRUD + tenant-wide tool-catalog ops. Admin floor.
  rpc CreateUpstream(CreateUpstreamRequest) returns (CreateUpstreamResponse);
  rpc UpdateUpstream(UpdateUpstreamRequest) returns (UpdateUpstreamResponse);
  rpc DeleteUpstream(DeleteUpstreamRequest) returns (DeleteUpstreamResponse);
  rpc ReindexUpstreamCatalog(ReindexUpstreamCatalogRequest) returns (ReindexUpstreamCatalogResponse);
  rpc PreviewUpstreamContext(PreviewUpstreamContextRequest) returns (PreviewUpstreamContextResponse);

  // Tenant settings + dashboard step-completion toggles. Admin floor.
  rpc GetTenantSettings(GetTenantSettingsRequest) returns (GetTenantSettingsResponse);
  rpc UpdateTenantSettings(UpdateTenantSettingsRequest) returns (UpdateTenantSettingsResponse);

  // IDE presets + per-tenant redirect-URI allowlist. Admin floor.
  // See docs/phases/phase-09f-ide-presets-and-allowlist.md.
  rpc ListIDEPresets(ListIDEPresetsRequest) returns (ListIDEPresetsResponse);
  rpc ListAllowlistEntries(ListAllowlistEntriesRequest) returns (ListAllowlistEntriesResponse);
  rpc AddAllowlistEntry(AddAllowlistEntryRequest) returns (AddAllowlistEntryResponse);
  rpc UpdateAllowlistEntry(UpdateAllowlistEntryRequest) returns (UpdateAllowlistEntryResponse);
  rpc RemoveAllowlistEntry(RemoveAllowlistEntryRequest) returns (RemoveAllowlistEntryResponse);
  rpc ApplyIDEPreset(ApplyIDEPresetRequest) returns (ApplyIDEPresetResponse);
  rpc RemoveIDEPreset(RemoveIDEPresetRequest) returns (RemoveIDEPresetResponse);
  rpc MarkIDEChoiceSkipped(MarkIDEChoiceSkippedRequest) returns (MarkIDEChoiceSkippedResponse);

  // Owner-only. Limen-side soft-delete; Zitadel org cleanup is manual.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);

  // Member management. Pass-through to Zitadel User V2 +
  // Authorization V2; Limen stores no mirror tables. See
  // docs/phases/phase-09c-tenant-admin-spa.md "Member management".
  // All four require admin (owner satisfies admin).
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // Service account management. Admin floor.
  // Service accounts are Zitadel machine users mirrored locally. See
  // docs/phases/phase-09i-service-accounts.md.
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse);
  rpc GetServiceAccount(GetServiceAccountRequest) returns (GetServiceAccountResponse);
  rpc UpdateServiceAccount(UpdateServiceAccountRequest) returns (UpdateServiceAccountResponse);
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse);
  rpc DeleteServiceAccount(DeleteServiceAccountRequest) returns (DeleteServiceAccountResponse);
  rpc RegenerateServiceAccountToken(RegenerateServiceAccountTokenRequest) returns (RegenerateServiceAccountTokenResponse);

  // Service account upstream link management. Admin floor.
  rpc ListServiceAccountUpstreamLinks(ListServiceAccountUpstreamLinksRequest) returns (ListServiceAccountUpstreamLinksResponse);
  rpc SetServiceAccountLinkEnabled(SetServiceAccountLinkEnabledRequest) returns (SetServiceAccountLinkEnabledResponse);

  // Service account upstream linking — full lifecycle (OAuth, API key,
  // disconnect). Admin floor. See docs/phases/phase-09k-sa-upstream-linking.md.
  rpc StartServiceAccountConnect(StartServiceAccountConnectRequest) returns (StartServiceAccountConnectResponse);
  rpc SubmitServiceAccountAPIKey(SubmitServiceAccountAPIKeyRequest) returns (SubmitServiceAccountAPIKeyResponse);
  rpc ClearServiceAccountOverride(ClearServiceAccountOverrideRequest) returns (ClearServiceAccountOverrideResponse);
  rpc DisconnectServiceAccountUpstream(DisconnectServiceAccountUpstreamRequest) returns (DisconnectServiceAccountUpstreamResponse);

  // Admin OAuth flow for tenant-level upstream credentials.
  // Stores tokens in upstream_tenant_links for catalog indexing and
  // connection verification — not for tool call routing.
  rpc StartAdminConnect(StartAdminConnectRequest) returns (StartAdminConnectResponse);
  rpc FinishAdminCallback(FinishAdminCallbackRequest) returns (FinishAdminCallbackResponse);

  // Billing metrics chart data. Admin floor. See docs/phases/phase-13b-billing-metrics-pipeline.md.
  rpc GetActiveUserChart(GetActiveUserChartRequest) returns (GetActiveUserChartResponse);
  rpc GetSAConnectionChart(GetSAConnectionChartRequest) returns (GetSAConnectionChartResponse);

}

// ---- CreateUpstream -------------------------------------------------

// StaticHeaderMode controls whether per-user API key overrides are
// allowed for the static_header strategy.
enum StaticHeaderMode {
  STATIC_HEADER_MODE_UNSPECIFIED = 0;
  STATIC_HEADER_MODE_SHARED = 1;
  STATIC_HEADER_MODE_OVERRIDE = 2;
}

// OAuthClientOverride lets the admin pin a pre-registered upstream
// OAuth client (for mcp_spec ASes without DCR). Both fields are
// required when this message is present.
message OAuthClientOverride {
  string client_id = 1;
  string client_secret = 2;
}

message CreateUpstreamRequest {
  string identifier = 1;
  string display_name = 2;
  string mcp_url = 3;
  string strategy_type = 4;
  // For `static_header`: derived from `static_header_mode` below.
  // Reserved for strategies that grow real sub-modes later
  // (e.g. mcp_spec DCR vs static client).
  string strategy_sub_mode = 5;
  // Strategy-specific config map. For `static_header`:
  //   header_name          required, HTTP header field name
  //   header_template      required, must contain "{value}"
  //   value                required, shared secret substituted by default
  // (The mode is set via static_header_mode, not the config map.)
  // The whole map is encrypted into UpstreamStrategyConfig.config_json
  // at rest (AES-SIV with AAD bound to tenant).
  map<string, string> strategy_config = 6;
  // Optional pre-registered OAuth client for ASes without DCR.
  OAuthClientOverride oauth_client_override = 7;
  // JSON object serialised as a string; validated server-side via
  // gateway.validateContextBlob.
  string defaults_json = 8;
  // Controls per-user API key overrides for static_header strategy.
  // SHARED (default): shared secret only, no user overrides.
  // OVERRIDE: users may submit their own API keys.
  StaticHeaderMode static_header_mode = 9;
}

message CreateUpstreamResponse {
  limen.portal.v1.UpstreamSummary upstream = 1;
  // True when the strategy requires an owner/admin link before the
  // tool catalog can be populated (mcp_spec). `static_header` always
  // has a working shared secret, so this is false even when
  // static_header_mode is OVERRIDE.
  bool requires_admin_link = 2;
  // Absolute or SPA-relative URL the SPA should open to start the
  // admin-link flow. Empty when requires_admin_link is false.
  string connect_url = 3;
}

// ---- UpdateUpstream -------------------------------------------------

message UpdateUpstreamRequest {
  string public_id = 1;
  // Optional. Empty string clears the override; absent leaves it.
  // Use the wrapper-free convention: callers send empty strings to
  // mean "no change" — this matches the rest of PortalService.
  string display_name = 2;
  // Optional. Empty string is interpreted as "no change"; pass "{}"
  // to clear. Validated server-side.
  string defaults_json = 3;
  // Strategy-specific config patch. Only honoured for strategies that
  // carry an UpstreamStrategyConfig row (`static_header`).
  // Recognised keys for static_header:
  //   value                rotate the shared secret. Empty/absent = keep
  //                        existing.
  // header_name / header_template are intentionally immutable post-
  // creation (changing them constitutes a different upstream).
  map<string, string> strategy_config = 4;
  // Optional. For static_header: change the sub-mode. Absent = keep existing.
  // Switching from SHARED to OVERRIDE disables the tenant-wide secret
  // in favour of per-user keys — users must submit their own API keys after
  // the switch.
  StaticHeaderMode static_header_mode = 5;
}

message UpdateUpstreamResponse {
  limen.portal.v1.UpstreamSummary upstream = 1;
}

// ---- DeleteUpstream -------------------------------------------------

message DeleteUpstreamRequest {
  string public_id = 1;
}

message DeleteUpstreamResponse {}

// ---- ReindexUpstreamCatalog ----------------------------------------

message ReindexUpstreamCatalogRequest {
  string public_id = 1;
}

message ReindexUpstreamCatalogResponse {
  limen.portal.v1.UpstreamSummary upstream = 1;
}

// ---- PreviewUpstreamContext ----------------------------------------

message PreviewUpstreamContextRequest {
  string public_id = 1;
  // Zitadel subject of the user whose per-link context the admin
  // wants to spot-check against the upstream's defaults_json.
  string user_id = 2;
}

message PreviewUpstreamContextResponse {
  // The merged JSON object as a string: merge(linkContext, defaultsJson).
  string merged_json = 1;
}

// ---- GetTenantSettings ---------------------------------------------

message GetTenantSettingsRequest {}

message GetTenantSettingsResponse {
  TenantSettings settings = 1;
  // Read-only Zitadel identity. The SPA renders these as a panel and
  // uses zitadel_org_id to build Console deep-links.
  string zitadel_org_id = 2;
  // Limen Gateway project ID (Zitadel-side). Constant per Limen
  // instance, echoed here so the SPA can render the
  // /ui/console/granted-projects/<projectId>/grant/<grantId> deep-link
  // for managing this tenant's role assignments without a separate
  // discovery round-trip.
  string zitadel_project_id = 3;
  // ID of the project grant that grants the Limen project to this
  // tenant's org. Empty when the grant cannot be resolved (Zitadel
  // unreachable, grant missing) — the SPA renders the
  // role-assignment card disabled in that case.
  string zitadel_project_grant_id = 4;
}

// ---- UpdateTenantSettings ------------------------------------------

message UpdateTenantSettingsRequest {
  // Optional. Empty string means "no change".
  string name = 1;
  // One-shot toggle: when true, flip tenant_settings.invited_team_at
  // to NOW() if it is currently NULL. No-op otherwise.
  bool invited_team_at_now = 2;
  // One-shot toggle: same semantics as invited_team_at_now but for
  // tenant_settings.configured_at.
  bool configured_at_now = 3;
}

message TenantSettings {
  string name = 1;
  string public_id = 2;
  // RFC3339; empty when unset.
  string invited_team_at = 3;
  string configured_at = 4;
  string chose_ide_at = 5;
}

message UpdateTenantSettingsResponse {
  TenantSettings settings = 1;
}

// ---- IDE presets & per-tenant redirect-URI allowlist ---------------
//
// See docs/phases/phase-09f-ide-presets-and-allowlist.md. The allowlist
// is one row per (tenant, pattern); rows seeded from an IDE preset
// carry ide_key, free-form admin entries carry ide_key = "".

message IDEPreset {
  // Stable key: "cursor", "vscode", "claude_code", ...
  string key = 1;
  string display_name = 2;
  // Lucide icon name shown on the quick-setup tile.
  string icon = 3;
  // Raw glob patterns the preset declares. Every pattern passes
  // oauthproxy.CompilePattern at seed time.
  repeated string patterns = 4;
  int32 sort_order = 5;
}

message AllowlistEntry {
  // "ral_<ULID>" — opaque to the SPA, only used as the addressable id
  // on Update/Remove.
  string public_id = 1;
  // "" when the entry is a free-form admin entry (no preset link).
  string ide_key = 2;
  string label = 3;
  string pattern = 4;
  // RFC3339.
  string created_at = 5;
}

message ListIDEPresetsRequest {}
message ListIDEPresetsResponse {
  repeated IDEPreset presets = 1;
}

message ListAllowlistEntriesRequest {}
message ListAllowlistEntriesResponse {
  repeated AllowlistEntry entries = 1;
}

message AddAllowlistEntryRequest {
  // Empty for custom entries.
  string ide_key = 1;
  string label = 2;
  string pattern = 3;
}
message AddAllowlistEntryResponse {
  AllowlistEntry entry = 1;
}

message UpdateAllowlistEntryRequest {
  string public_id = 1;
  string label = 2;
  string pattern = 3;
}
message UpdateAllowlistEntryResponse {
  AllowlistEntry entry = 1;
}

message RemoveAllowlistEntryRequest {
  string public_id = 1;
}
message RemoveAllowlistEntryResponse {}

message ApplyIDEPresetRequest {
  string ide_key = 1;
}
message ApplyIDEPresetResponse {
  // Rows freshly inserted by this call.
  int32 added = 1;
  // Rows already present (idempotent re-apply).
  int32 already_present = 2;
}

message RemoveIDEPresetRequest {
  string ide_key = 1;
}
message RemoveIDEPresetResponse {
  int32 removed = 1;
}

message MarkIDEChoiceSkippedRequest {}
message MarkIDEChoiceSkippedResponse {
  TenantSettings settings = 1;
}

// ---- DeleteTenant --------------------------------------------------

message DeleteTenantRequest {
  // Typed confirmation: caller must send the tenant's PublicID
  // verbatim. Mismatches reject with invalid_argument.
  string public_id_confirmation = 1;
}

message DeleteTenantResponse {}

// ---- Member management ---------------------------------------------

// MemberRole is the closed set of role keys the tenant admin can
// assign on the Limen project. Mirrors the keys seeded by
// scripts/zitadel-bootstrap (member / admin / owner). super_admin is
// staff-only and deliberately absent so it cannot be assigned over
// the wire.
enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_MEMBER = 1;
  MEMBER_ROLE_ADMIN = 2;
  MEMBER_ROLE_OWNER = 3;
}

// MemberState mirrors Zitadel's UserState. UNSPECIFIED is returned
// only when Zitadel reports a state Limen does not understand.
enum MemberState {
  MEMBER_STATE_UNSPECIFIED = 0;
  MEMBER_STATE_ACTIVE = 1;
  MEMBER_STATE_INACTIVE = 2;
  MEMBER_STATE_LOCKED = 3;
  MEMBER_STATE_INITIAL = 4;
}

message Member {
  // Zitadel user id.
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  // UNSPECIFIED when the user exists in the org but has no grant on
  // the Limen project (invited but not yet authorized — the row is
  // still surfaced so the admin can fix the missing grant).
  MemberRole role = 4;
  MemberState state = 5;
  // RFC3339; empty when Zitadel has no last-login record.
  string last_login = 6;
}

message ListMembersRequest {
  // Optional substring; applied server-side as a Zitadel
  // DisplayNameQuery / EmailQuery OR. Empty returns everyone.
  string search = 1;
  // UNSPECIFIED returns everyone regardless of role.
  MemberRole role_filter = 2;
}
message ListMembersResponse {
  repeated Member members = 1;
}

message InviteMemberRequest {
  string email = 1;
  string given_name = 2;
  string family_name = 3;
  // Required. UNSPECIFIED rejects with invalid_argument.
  MemberRole role = 4;
}
message InviteMemberResponse {
  Member member = 1;
}

message UpdateMemberRoleRequest {
  string user_id = 1;
  // Required. UNSPECIFIED rejects with invalid_argument.
  MemberRole role = 2;
}
message UpdateMemberRoleResponse {
  Member member = 1;
}

message RemoveMemberRequest {
  string user_id = 1;
}
message RemoveMemberResponse {}

// ---- Service accounts -----------------------------------------------

// ServiceAccountRole is the closed set of roles a service account can
// hold. Owner is intentionally absent — service accounts must never be
// tenant owners.
enum ServiceAccountRole {
  SERVICE_ACCOUNT_ROLE_UNSPECIFIED = 0;
  SERVICE_ACCOUNT_ROLE_MEMBER = 1;
  SERVICE_ACCOUNT_ROLE_ADMIN = 2;
}

message ServiceAccount {
  // "sa_<ULID>" — public identifier.
  string public_id = 1;
  string name = 2;
  string description = 3;
  ServiceAccountRole role = 4;
  // Public ID of the user who created this service account.
  string created_by_id = 5;
  // RFC3339 creation timestamp.
  string created_at = 6;
  // RFC3339 timestamp of when the current token was last generated or
  // regenerated. Omitted (empty string) if no token has been generated yet.
  string token_generated_at = 7;
  // RFC3339 timestamp of when the token was last used for authentication
  // via the bearer token interceptor. Omitted (empty string) if never used.
  string last_used_at = 8;
}

message CreateServiceAccountRequest {
  string name = 1;
  string description = 2;
  // Required. UNSPECIFIED and owner-equivalent values reject with
  // invalid_argument. Only MEMBER and ADMIN are accepted.
  ServiceAccountRole role = 3;
  // Days until the PAT expires. 0 means no expiry. Default 365 when 0.
  uint32 expiry_days = 4;
}

message CreateServiceAccountResponse {
  ServiceAccount service_account = 1;
  // One-time PAT. Only returned on creation; never stored server-side.
  string token = 2;
}

message ListServiceAccountsRequest {}

message ListServiceAccountsResponse {
  repeated ServiceAccount service_accounts = 1;
}

message DeleteServiceAccountRequest {
  string public_id = 1;
}

message DeleteServiceAccountResponse {}

message RegenerateServiceAccountTokenRequest {
  string public_id = 1;
  // Days until the new PAT expires. 0 means no expiry. Default 365.
  uint32 expiry_days = 2;
}

message RegenerateServiceAccountTokenResponse {
  // One-time PAT. Old tokens are revoked.
  string token = 1;
}

message GetServiceAccountRequest {
  string public_id = 1;
}
message GetServiceAccountResponse {
  ServiceAccount service_account = 1;
}

message UpdateServiceAccountRequest {
  string public_id = 1;
  optional string name = 2;
  optional string description = 3;
}
message UpdateServiceAccountResponse {
  ServiceAccount service_account = 1;
}

message ServiceAccountUpstreamLink {
  string upstream_public_id = 1;
  string upstream_name = 2;
  string upstream_url = 3;
  bool enabled = 4;
  string connected_at = 5;
}
message ListServiceAccountUpstreamLinksRequest {
  string service_account_public_id = 1;
}
message ListServiceAccountUpstreamLinksResponse {
  repeated ServiceAccountUpstreamLink links = 1;
}

message SetServiceAccountLinkEnabledRequest {
  string service_account_public_id = 1;
  string upstream_public_id = 2;
  bool enabled = 3;
}
message SetServiceAccountLinkEnabledResponse {}

// ---- Service account upstream linking (Phase 9k) ---------------------

message StartServiceAccountConnectRequest {
  string service_account_public_id = 1;
  string upstream_public_id = 2;
  // SPA path to return to after OAuth callback.
  string return_to = 3;
}
message StartServiceAccountConnectResponse {
  // Absolute URL the SPA redirects to (OAuth authorize endpoint).
  string redirect_url = 1;
}

message SubmitServiceAccountAPIKeyRequest {
  string service_account_public_id = 1;
  string upstream_public_id = 2;
  string api_key = 3;
}
message SubmitServiceAccountAPIKeyResponse {}

message ClearServiceAccountOverrideRequest {
  string service_account_public_id = 1;
  string upstream_public_id = 2;
}
message ClearServiceAccountOverrideResponse {}

message DisconnectServiceAccountUpstreamRequest {
  string service_account_public_id = 1;
  string upstream_public_id = 2;
}
message DisconnectServiceAccountUpstreamResponse {}

// ---- Admin upstream OAuth (tenant-level credentials) ----------------

message StartAdminConnectRequest {
  string upstream_public_id = 1;
  string return_to = 2;  // SPA URL to redirect back to after OAuth completes
}

message StartAdminConnectResponse {
  string redirect_url = 1;
}

message FinishAdminCallbackRequest {
  string upstream_public_id = 1;
  string callback_query = 2;  // raw query string from AS redirect
}

message FinishAdminCallbackResponse {
  string return_to = 1;  // the SPA URL captured during StartAdminConnect
}

// ---- Billing metrics charts (Phase 13b) ---------------------------

message GetActiveUserChartRequest {
  // Optional: from_date (inclusive). Defaults to 30 days ago.
  google.protobuf.Timestamp from_date = 1;
  // Optional: to_date (exclusive). Defaults to now.
  google.protobuf.Timestamp to_date = 2;
}

message GetActiveUserChartResponse {
  message DataPoint {
    string date = 1;              // "2026-05-27"
    int32 active_user_count = 2;  // distinct users (human + SA) on that day
  }
  repeated DataPoint days = 1;
  bool has_data = 2;              // true if any data exists — gates chart visibility
}

message GetSAConnectionChartRequest {
  google.protobuf.Timestamp from_date = 1;
  google.protobuf.Timestamp to_date = 2;
}

message GetSAConnectionChartResponse {
  message DataPoint {
    string date = 1;              // "2026-05-27"
    int32 peak_connections = 2;   // MAX(concurrent_count) on that day
  }
  repeated DataPoint days = 1;
  bool has_data = 2;
}
